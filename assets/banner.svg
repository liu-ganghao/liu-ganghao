<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 360" width="1600" height="360" role="img" aria-label="Theo Liu (刘港昊), Ph.D. Candidate in Computer Science, East China University of Science and Technology">
  <title>Theo Liu</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#061324"/>
      <stop offset="0.6" stop-color="#0a1f3a"/>
      <stop offset="1" stop-color="#0d2b4e"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1a5fb4" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#1a5fb4" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#1a5fb4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4f9cf0" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#4f9cf0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowIndigo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7d8cf5" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#7d8cf5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6aa7ea" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#9cc4f5" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#6aa7ea" stop-opacity="0"/>
    </linearGradient>
    <style>
      .a1 { animation: drift1 18s ease-in-out infinite alternate; }
      .a2 { animation: drift2 22s ease-in-out infinite alternate; }
      .a3 { animation: drift3 15s ease-in-out infinite alternate; }
      @keyframes drift1 { from { transform: translate(-30px, -10px); } to { transform: translate(50px, 18px); } }
      @keyframes drift2 { from { transform: translate(20px, 10px); } to { transform: translate(-60px, -20px); } }
      @keyframes drift3 { from { transform: translate(-20px, 0); } to { transform: translate(40px, 12px); } }
      .p1 { animation: twinkle 5s ease-in-out infinite; }
      .p2 { animation: twinkle 7s ease-in-out -2s infinite; }
      .p3 { animation: twinkle 6s ease-in-out -4s infinite; }
      @keyframes twinkle { 0%, 100% { opacity: 0.12; } 50% { opacity: 0.55; } }
      .name { font-family: Georgia, 'Times New Roman', serif; font-size: 84px; fill: #f4f8ff; letter-spacing: 1.5px; }
      .cn { font-family: 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', sans-serif; font-size: 30px; fill: #b9d4f4; letter-spacing: 6px; }
      .sub { font-family: 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif; font-size: 21px; fill: #d9e7fa; letter-spacing: 1.2px; }
      .tag { font-family: 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif; font-size: 15.5px; fill: #8fb4e0; letter-spacing: 2.4px; }
    </style>
  </defs>

  <rect width="1600" height="360" fill="url(#bg)"/>

  <ellipse class="a1" cx="300" cy="70" rx="540" ry="230" fill="url(#glowBlue)"/>
  <ellipse class="a2" cx="1280" cy="300" rx="560" ry="240" fill="url(#glowCyan)"/>
  <ellipse class="a3" cx="900" cy="30" rx="440" ry="190" fill="url(#glowIndigo)"/>

  <circle class="p1" cx="190" cy="120" r="2.6" fill="#9cc4f5"/>
  <circle class="p2" cx="1400" cy="90" r="3.2" fill="#9cc4f5"/>
  <circle class="p3" cx="1180" cy="250" r="2.2" fill="#9cc4f5"/>
  <circle class="p1" cx="420" cy="290" r="2" fill="#9cc4f5"/>
  <circle class="p2" cx="1060" cy="60" r="2.4" fill="#9cc4f5"/>

  <g text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif">
    <rect x="700" y="96" width="200" height="1.6" fill="url(#rule)"/>
    <text class="name" x="800" y="178">Theo Liu</text>
    <text class="cn" x="800" y="216">刘港昊</text>
    <text class="sub" x="800" y="258">Ph.D. Candidate in Computer Science · East China University of Science and Technology</text>
    <text class="tag" x="800" y="292">LARGE LANGUAGE MODELS · PEFT · MULTIMODAL LLMS · EMBODIED AI / VLA</text>
  </g>
</svg>
